name: Housekeeping
on:
  # Run every Sunday at 7:00
  schedule:
    - cron: '0 7 * * 6'
  workflow_dispatch:

# for security reasons the github actions are pinned to specific SHAs
jobs:
  chores:
    name: Tidy workflows
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:
      - name: Delete stale workflow runs
        uses: Mattraks/delete-workflow-runs@5bf9a1dac5c4d041c029f0a8370ddf0c5cb5aeb7 # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 28
          keep_minimum_runs: 25

      - name: Delete unused workflow runs
        uses: otto-de/purge-deprecated-workflow-runs@c1c15cf4f591945ca017d41f04758773b74de629 # v4.0.13
        with:
          token: ${{ github.token }}

  link_checker:
    name: Link checker
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout markdown
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: --verbose --no-progress --max-retries 1 '**/*.md' '*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
